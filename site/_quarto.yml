project:
  type: website
  output-dir: _site

website:
  title: "Stockr"
  description: "Overnight snapshot of the watchlist"
  navbar:
    background: dark
    left:
      - href: index.qmd
        text: Morning Board

format:
  html:
    theme: [flatly, styles.scss]
    toc: false
    page-layout: full
    code-tools: false
    # Resizes Plotly charts when their tab becomes visible — see the file.
    include-after-body: resize-tabs.html

execute:
  echo: false
  warning: false
  freeze: false
