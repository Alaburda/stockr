name: Build & Deploy Site

on:
  schedule:
    # 23:00 UTC = 02:00 in Vilnius during summer time (01:00 in winter), i.e.
    # about two hours after the US close. Tue–Sat UTC so each weekday close
    # lands on the following morning's page.
    - cron: "0 23 * * 2-6"
  push:
    branches: [master]
    paths:
      - site/**
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Allow the job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't let a scheduled run and a manual run fight over the deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # Pinned to the version the site was developed and verified against, so a
      # new Quarto release can't silently change the render. Safe to bump.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.52"

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Render site
        run: quarto render site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
